[project]
name = "vevorweatherprom"
version = "0.0.1"
dependencies = [
    "flask",
    "pytz",
    "paho-mqtt",
    "requests",
    "dnspython",
    "prometheus-client>=0.22.1",
    "pydantic>=2.11.7",
]

[project.scripts]
vevorweatherprom = "vevorweatherprom.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vevorweatherprom"]

[tool.hatch.build]
packages = ["src/vevorweatherprom"]

[tool.uv]
package = true